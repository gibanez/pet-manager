<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Base DDD</title>
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Base<span>DDD</span></a>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About us</a>
            <a href="/contact" class="is-active">Contact</a>
        </nav>
    </header>

    <main>
        <section class="page">
            <p class="eyebrow">Contacto</p>
            <h1>Escribinos</h1>
            <p class="lead">El formulario hace <code>POST /api/inquiries</code> y guarda el mensaje en SQLite.</p>

            <form id="contact-form" class="contact-form" novalidate>
                <label>
                    Nombre
                    <input type="text" name="name" maxlength="120" required autocomplete="name">
                </label>
                <label>
                    Email
                    <input type="email" name="email" maxlength="190" required autocomplete="email">
                </label>
                <label>
                    Mensaje
                    <textarea name="message" rows="5" maxlength="2000" required></textarea>
                </label>
                <button type="submit" class="btn btn-primary">Enviar</button>
                <p id="contact-status" class="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>© <span id="year"></span> Base DDD</p>
    </footer>

    <script src="/assets/site.js"></script>
</body>
</html>
